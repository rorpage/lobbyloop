<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LobbyLoop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
  }
  #wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #poster, #posterVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  #posterVideo {
    display: none;
  }
</style>
</head>
<body>
  <div id="wrapper">
    <img id="poster" src="" alt="poster">
    <video id="posterVideo" autoplay muted loop playsinline></video>
  </div>

  <script>
    // Config. Edit these values to change behavior.
    const CONFIG = {
      posterFolder: "posters",
      cycleSeconds: 15,        // how long each GIF stays on screen
      enableJellyfin: false,   // set to true later to enable now-playing mode
      jellyfinPollSeconds: 10, // how often to check Jellyfin for now-playing
      rotateDegrees: 90        // 0, 90, 180, or 270. Rotates the display.
    };

    const wrapperEl = document.getElementById("wrapper");

    function applyRotation(degrees) {
      if (degrees === 90) {
        wrapperEl.style.width = "100vh";
        wrapperEl.style.height = "100vw";
        wrapperEl.style.transformOrigin = "top left";
        wrapperEl.style.transform = "rotate(90deg) translateY(-100%)";
      } else if (degrees === 180) {
        wrapperEl.style.width = "100vw";
        wrapperEl.style.height = "100vh";
        wrapperEl.style.transformOrigin = "center center";
        wrapperEl.style.transform = "rotate(180deg)";
      } else if (degrees === 270) {
        wrapperEl.style.width = "100vh";
        wrapperEl.style.height = "100vw";
        wrapperEl.style.transformOrigin = "top left";
        wrapperEl.style.transform = "rotate(270deg) translateX(-100%)";
      } else {
        // 0 degrees, no rotation.
        wrapperEl.style.width = "100vw";
        wrapperEl.style.height = "100vh";
        wrapperEl.style.transform = "none";
      }
    }

    let posterList = [];
    let currentIndex = 0;
    let cycleTimer = null;

    const posterEl = document.getElementById("poster");
    const videoEl = document.getElementById("posterVideo");

    function isVideoFile(name) {
      const lower = name.toLowerCase();
      return lower.endsWith(".mp4") || lower.endsWith(".webm");
    }

    function displayMedia(url, label) {
      if (isVideoFile(label)) {
        posterEl.style.display = "none";
        videoEl.style.display = "block";
        videoEl.src = url;
        videoEl.play().catch(() => {});
      } else {
        videoEl.pause();
        videoEl.style.display = "none";
        posterEl.style.display = "block";
        posterEl.src = url;
      }
      console.log("Showing:", label);
    }

    async function loadPosterList() {
      const res = await fetch("/api/posters");
      if (!res.ok) {
        console.error("Could not load poster list.");
        return [];
      }
      return res.json();
    }

    function showPoster(index) {
      if (posterList.length === 0) return;
      const name = posterList[index];
      const url = CONFIG.posterFolder + "/" + name + "?t=" + Date.now();
      displayMedia(url, name);
    }

    function startCycle() {
      if (cycleTimer) clearInterval(cycleTimer);
      cycleTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % posterList.length;
        showPoster(currentIndex);
      }, CONFIG.cycleSeconds * 1000);
    }

    // Placeholder for the future Jellyfin integration.
    // When CONFIG.enableJellyfin is true, this checks a local endpoint
    // (to be built later) that reports what is currently playing on Jellyfin,
    // and swaps the displayed poster to match instead of cycling normally.
    async function checkJellyfin() {
      try {
        const res = await fetch("/api/now-playing");
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.posterFile) {
          if (cycleTimer) {
            clearInterval(cycleTimer);
            cycleTimer = null;
          }
          displayMedia(data.posterFile + "?t=" + Date.now(), "Now playing: " + (data.title || data.posterFile));
        } else if (!cycleTimer) {
          // nothing playing, go back to the loop
          startCycle();
        }
      } catch (err) {
        // Jellyfin endpoint not built yet or unreachable. Ignore for now.
      }
    }

    async function init() {
      applyRotation(CONFIG.rotateDegrees);
      posterList = await loadPosterList();
      if (posterList.length === 0) {
        console.warn("No poster files found in the posters folder.");
        return;
      }
      showPoster(currentIndex);
      startCycle();

      if (CONFIG.enableJellyfin) {
        setInterval(checkJellyfin, CONFIG.jellyfinPollSeconds * 1000);
      }
    }

    init();
  </script>
</body>
</html>
